name: Agent evidence events

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-evidence-events-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body || '', '<!-- roadmap-agent:start -->') ||
            contains(github.event.changes.body.from || '', '<!-- roadmap-agent:start -->'))) ||
        (github.event_name == 'issue_comment' &&
          (github.event.action == 'deleted' ||
            contains(github.event.comment.body || '', '<!-- roadmap-agent:start -->') ||
            contains(github.event.comment.body || '', '<!-- roadmap-agent-validation-attestation:start -->') ||
            (github.event.action == 'edited' &&
              (contains(github.event.changes.body.from || '', '<!-- roadmap-agent:start -->') ||
                contains(github.event.changes.body.from || '', '<!-- roadmap-agent-validation-attestation:start -->')))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch evidence runtime through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/agent-evidence-runtime"
          mkdir -p "${runtime}/scripts" "${runtime}/data"

          files=(
            scripts/agent-protocol.mjs
            scripts/validate-agents.mjs
            scripts/agent-evidence-integrity.mjs
            data/portfolio.json
          )

          for file in "${files[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${SOURCE_REF}" --jq .content \
              | base64 --decode > "${runtime}/${file}"
          done

          echo "AGENT_EVIDENCE_RUNTIME=${runtime}" >> "${GITHUB_ENV}"

      - name: Validate changed checkpoint evidence and Session immutability
        id: evidence
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${AGENT_EVIDENCE_RUNTIME}"
          node scripts/agent-evidence-integrity.mjs --validate-event

      - name: Publish successful candidate validation attestation
        if: >-
          ${{
            github.event_name == 'issue_comment' &&
            github.event.action == 'created' &&
            steps.evidence.outputs.validation_attestation_body_b64 != ''
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_ATTESTATION_BODY_B64: ${{ steps.evidence.outputs.validation_attestation_body_b64 }}
        run: |
          set -euo pipefail
          body="$(printf '%s' "${VALIDATION_ATTESTATION_BODY_B64}" | base64 --decode)"
          case "${body}" in
            *'<!-- roadmap-agent-validation-attestation:start -->'*) ;;
            *) echo 'validation attestation output is missing its authority marker' >&2; exit 1 ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -f body="${body}"
