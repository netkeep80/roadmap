name: Agent status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/portfolio.json"
      - "data/worker-policy.json"
      - "scripts/agent-protocol.mjs"
      - "scripts/worker-runtime.mjs"
      - "scripts/pr-reconciliation.mjs"
      - "scripts/agent-status.mjs"
      - "scripts/validate-agents.mjs"
      - "scripts/sync-agent-status.mjs"
      - "scripts/agent-evidence-integrity.mjs"
      - ".github/workflows/agent-status.yml"
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-status
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'issues' &&
          github.event.issue.number != 103 &&
          (contains(github.event.issue.body || '', '<!-- roadmap-agent:start -->') ||
            (github.event.action == 'edited' && contains(github.event.changes.body.from || '', '<!-- roadmap-agent:start -->')))) ||
        (github.event_name == 'issue_comment' &&
          (github.event.action == 'deleted' ||
            contains(github.event.comment.body || '', '<!-- roadmap-agent:start -->') ||
            (github.event.action == 'edited' && contains(github.event.changes.body.from || '', '<!-- roadmap-agent:start -->'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch only status runtime inputs through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/agent-status-runtime"
          mkdir -p "${runtime}/scripts" "${runtime}/data"

          files=(
            scripts/agent-protocol.mjs
            scripts/worker-runtime.mjs
            scripts/pr-reconciliation.mjs
            scripts/agent-status.mjs
            scripts/validate-agents.mjs
            scripts/sync-agent-status.mjs
            scripts/agent-evidence-integrity.mjs
            data/portfolio.json
            data/worker-policy.json
          )

          for file in "${files[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${SOURCE_REF}" --jq .content \
              | base64 --decode > "${runtime}/${file}"
          done

          echo "AGENT_STATUS_RUNTIME=${runtime}" >> "${GITHUB_ENV}"

      - name: Validate changed checkpoint commit evidence and v2 Session immutability
        if: >-
          ${{
            (github.event_name == 'issue_comment' &&
              (github.event.action == 'created' || github.event.action == 'edited' || github.event.action == 'deleted')) ||
            (github.event_name == 'issues' && github.event.action == 'edited')
          }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${AGENT_STATUS_RUNTIME}"
          node scripts/agent-evidence-integrity.mjs --validate-event

      - name: Publish current worker state to permanent Issue
        if: >-
          ${{ github.event_name != 'issue_comment' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_STATUS_ISSUE_NUMBER: "103"
        run: |
          cd "${AGENT_STATUS_RUNTIME}"
          node scripts/sync-agent-status.mjs

      - name: Publish fail-closed invalid status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          # Agent Control Plane Status

          > **CONTROL PLANE INVALID — DO NOT USE THE PREVIOUS SNAPSHOT FOR WORK SELECTION.**

          - Detected at: ${checked_at}
          - Live protocol/evidence validation failed closed.
          - Scheduled workers must not infer authority or executable work from the previous generated snapshot.
          - Re-read GitHub after the control-plane defect is repaired and a fresh successful Agent Status run is observed.
          - Diagnostic workflow: ${run_url}
          EOF
          )"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/103" -f body="${body}"
