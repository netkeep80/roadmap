name: Portfolio validate

on:
  pull_request:
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - "scripts/agent-protocol.mjs"
      - "scripts/agent-protocol.test.mjs"
      - "scripts/validate-agents.mjs"
      - "scripts/validate-agents.test.mjs"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"
      - "README.md"
      - "AGENTS.md"
      - "AGENT_PROTOCOL.md"
      - "OPERATING_MODEL.md"
      - "DECISIONS.md"
  push:
    branches: [main]
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - "scripts/agent-protocol.mjs"
      - "scripts/agent-protocol.test.mjs"
      - "scripts/validate-agents.mjs"
      - "scripts/validate-agents.test.mjs"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"
      - "README.md"
      - "AGENTS.md"
      - "AGENT_PROTOCOL.md"
      - "OPERATING_MODEL.md"

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test agent protocol
        run: node --test scripts/agent-protocol.test.mjs scripts/validate-agents.test.mjs
      - name: Validate registry
        run: node scripts/sync-roadmap.mjs --validate
      - name: Validate live GitHub coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-roadmap.mjs --validate-live
      - name: Validate Agent Control Plane (advisory rollout)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-agents.mjs
