name: Portfolio validate

on:
  pull_request:
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - "scripts/agent-protocol.mjs"
      - "scripts/agent-protocol.test.mjs"
      - "scripts/agent-protocol-v2.test.mjs"
      - "scripts/validate-agents.mjs"
      - "scripts/validate-agents.test.mjs"
      - "scripts/agent-role-template.mjs"
      - "scripts/agent-role-template.test.mjs"
      - "scripts/reconcile-agent-roles.mjs"
      - "scripts/reconcile-agent-roles.test.mjs"
      - "scripts/observer-snapshot.mjs"
      - "scripts/observer-snapshot.test.mjs"
      - "repo-policy.json"
      - ".github/workflows/repo-guard.yml"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"
      - ".github/workflows/agent-evidence-events.yml"
      - ".github/workflows/agent-evidence-integrity.yml"
      - ".github/workflows/agent-roles.yml"
      - "README.md"
      - "AGENTS.md"
      - "AGENT_PROTOCOL.md"
      - "SCHEDULED_OBSERVERS.md"
      - "OPERATING_MODEL.md"
      - "DECISIONS.md"
  push:
    branches: [main]
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - "scripts/agent-protocol.mjs"
      - "scripts/agent-protocol.test.mjs"
      - "scripts/agent-protocol-v2.test.mjs"
      - "scripts/validate-agents.mjs"
      - "scripts/validate-agents.test.mjs"
      - "scripts/agent-role-template.mjs"
      - "scripts/agent-role-template.test.mjs"
      - "scripts/reconcile-agent-roles.mjs"
      - "scripts/reconcile-agent-roles.test.mjs"
      - "scripts/observer-snapshot.mjs"
      - "scripts/observer-snapshot.test.mjs"
      - "repo-policy.json"
      - ".github/workflows/repo-guard.yml"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"
      - ".github/workflows/agent-evidence-events.yml"
      - ".github/workflows/agent-evidence-integrity.yml"
      - ".github/workflows/agent-roles.yml"
      - "README.md"
      - "AGENTS.md"
      - "AGENT_PROTOCOL.md"
      - "SCHEDULED_OBSERVERS.md"
      - "OPERATING_MODEL.md"
      - "DECISIONS.md"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test current control-plane contracts
        run: node --test scripts/agent-protocol.test.mjs scripts/agent-protocol-v2.test.mjs scripts/validate-agents.test.mjs scripts/agent-role-template.test.mjs scripts/reconcile-agent-roles.test.mjs scripts/observer-snapshot.test.mjs
      - name: Validate registry
        run: node scripts/sync-roadmap.mjs --validate
      - name: Validate live GitHub coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-roadmap.mjs --validate-live
      - name: Enforce public Agent Role coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-agents.mjs --enforce
