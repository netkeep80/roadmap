name: Portfolio validate

on:
  pull_request:
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"
      - "OPERATING_MODEL.md"
      - "DECISIONS.md"
  push:
    branches: [main]
    paths:
      - "data/portfolio.json"
      - "scripts/sync-roadmap.mjs"
      - ".github/workflows/portfolio-validate.yml"
      - ".github/workflows/portfolio-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate registry
        run: node scripts/sync-roadmap.mjs --validate
      - name: Validate live GitHub coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-roadmap.mjs --validate-live
