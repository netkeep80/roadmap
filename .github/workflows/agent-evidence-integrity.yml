name: Agent evidence integrity

on:
  pull_request:
    paths:
      - "scripts/agent-evidence-integrity.mjs"
      - "scripts/agent-evidence-integrity.test.mjs"
      - "scripts/agent-evidence-integrity-acceptance.test.mjs"
      - "scripts/agent-evidence-integrity-acceptance-attestation.test.mjs"
      - "scripts/agent-evidence-integrity-acceptance-success.test.mjs"
      - "scripts/agent-evidence-integrity-provenance.test.mjs"
      - ".github/workflows/agent-evidence-integrity.yml"
      - ".github/workflows/agent-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test evidence integrity boundary
        run: node --test scripts/agent-evidence-integrity.test.mjs scripts/agent-evidence-integrity-acceptance.test.mjs scripts/agent-evidence-integrity-acceptance-attestation.test.mjs scripts/agent-evidence-integrity-acceptance-success.test.mjs scripts/agent-evidence-integrity-provenance.test.mjs
